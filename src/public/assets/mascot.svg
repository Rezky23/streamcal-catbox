<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="streamcalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Outer Rounded Badge -->
  <rect x="8" y="8" width="104" height="104" rx="28" fill="#1e1e2f" stroke="url(#streamcalGrad)" stroke-width="4"/>
  
  <!-- Cat Ears -->
  <polygon points="32,45 42,20 54,42" fill="#7c3aed" />
  <polygon points="36,43 43,26 50,41" fill="#ec4899" />
  
  <polygon points="88,45 78,20 66,42" fill="#7c3aed" />
  <polygon points="84,43 77,26 70,41" fill="#ec4899" />
  
  <!-- Cat Head -->
  <circle cx="60" cy="62" r="32" fill="#2d2d44" stroke="#4f46e5" stroke-width="3" />
  
  <!-- Eyes -->
  <ellipse cx="48" cy="58" rx="5" ry="8" fill="#ec4899" />
  <circle cx="46" cy="55" r="2" fill="#ffffff" />
  
  <ellipse cx="72" cy="58" rx="5" ry="8" fill="#ec4899" />
  <circle cx="70" cy="55" r="2" fill="#ffffff" />
  
  <!-- Cute Nose & Mouth -->
  <polygon points="58,66 62,66 60,69" fill="#f472b6" />
  <path d="M55,71 Q60,75 60,71 Q60,75 65,71" stroke="#f472b6" stroke-width="2" fill="none" stroke-linecap="round" />
  
  <!-- Whiskers -->
  <line x1="30" y1="64" x2="42" y2="66" stroke="#94a3b8" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="28" y1="72" x2="41" y2="70" stroke="#94a3b8" stroke-width="1.8" stroke-linecap="round"/>
  
  <line x1="90" y1="64" x2="78" y2="66" stroke="#94a3b8" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="92" y1="72" x2="79" y2="70" stroke="#94a3b8" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Upload Arrow symbol on forehead -->
  <path d="M60,40 L60,49 M56,44 L60,40 L64,44" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
</svg>
